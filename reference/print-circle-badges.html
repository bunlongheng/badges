<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Circle Overlay Print</title>
        <style>
            body {
                margin: 0;
                padding: 0;
                font-family: sans-serif;
                background: #f9f9f9;
                text-align: center;
            }
            .container {
                padding: 20px;
            }
            .circle-container {
                display: inline-block;
                width: 2.5in;
                height: 2.5in;
                margin: 10px;
                border-radius: 50%;
                overflow: hidden;
                background: white;
                box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
            }
            .circle-container img {
                width: 100%;
                height: 100%;
                object-fit: cover;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="circle-container">
                <img src="your-image-1.png" alt="Image 1" />
            </div>
            <div class="circle-container">
                <img src="your-image-2.png" alt="Image 2" />
            </div>
            <div class="circle-container">
                <img src="your-image-3.png" alt="Image 3" />
            </div>
            <!-- Add more as needed -->
        </div>
    </body>
</html>
